[PHP]
post_max_size = 4G
upload_max_filesize = 4G
memory_limit = 4G
max_execution_time = 1000
max_input_time = 1000
variables_order = EGPCS
pcov.directory = .
max_file_uploads=200
expose_php = Off

; OPcache: bytecode cache — avoids recompiling every PHP file on each request.
; Big win for the tusd hook endpoints, which boot the framework per request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1

; Disable output buffering for better streaming performance
; This allows data to be sent to the client immediately rather than being buffered
output_buffering = Off
implicit_flush = Off
zlib.output_compression = Off
